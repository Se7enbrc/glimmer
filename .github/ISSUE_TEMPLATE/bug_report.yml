name: Bug report
description: Report a streaming, pairing, input, or UI problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what went wrong and how to reproduce it. For streaming
        problems, an optional session scorecard and log can help. Telemetry
        **stays on your Mac until you attach it.** The files include performance
        numbers, the app you streamed, and your display and network setup.
        PC and Mac names appear as short codes; addresses and private error
        details are redacted. Review every attachment before posting, and never
        include keys, PINs, certificates or provisioning profiles.
  - type: input
    id: version
    attributes:
      label: Glimmer version
      description:
        Settings → About, or `defaults read
        /Applications/Glimmer.app/Contents/Info CFBundleShortVersionString`
      placeholder: "2026.10.6"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Mac + macOS version
      placeholder: 'MacBook Pro 14", macOS 26.x'
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: PC (Sunshine version, OS and GPU)
      placeholder: "Sunshine 2026.8.26, Windows 11, RTX 4080"
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Network link between Mac and PC
      options:
        - Wired Ethernet (both ends)
        - Wi-Fi (Mac) → wired PC
        - Wi-Fi both ends
        - VPN / tailnet / remote
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description:
        What did you do, what did you expect, what happened instead? Rough
        timestamps help.
    validations:
      required: true
  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry scorecard + session log
      description: |
        For streaming-quality issues (stutter, freezes, audio dropouts, input
        lag) please attach the session artifacts:

        1. Enable telemetry: in Settings → About, **option-click the version
           line** to reveal the Telemetry section inside Settings →
           Diagnostics, then turn on **Performance telemetry**. It applies on
           the next stream, not the running one.
        2. Reproduce the problem in a stream. When it "feels bad", press
           **⌃B** to drop a timestamped bookmark into the telemetry.
        3. End the stream, then attach from `~/Library/Logs/Glimmer/`:
           - `telemetry-session-<timestamp>.json` - the session scorecard
           - `glimmer-<timestamp>.log` - the session log
           - (optionally) `telemetry-<timestamp>.ndjson` - per-second metrics,
             if the file isn't too large to attach

        Copied logs and session files redact private fields. Review them before
        uploading; streamed app names and display or network details may remain.
      placeholder: Drag and drop the files here.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description:
        Display setup (resolution / refresh / HDR), controller model, settings
        that differ from defaults, etc.
