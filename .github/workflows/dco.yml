name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check author sign-offs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def git(*args, input=None):
              return subprocess.run(
                  ["git", *args], input=input, text=True, check=True,
                  stdout=subprocess.PIPE,
              ).stdout

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              pr = json.load(event_file)["pull_request"]
          base, head = pr["base"]["sha"], pr["head"]["sha"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head)):
              sys.exit("Invalid PR commit range.")
          commits = git("rev-list", f"{base}..{head}").splitlines()
          if not commits:
              sys.exit("No PR commits found.")

          owner_names = {"se7enbrc", "ugfuglio"}
          owner_emails = {
              "se7en.brc@gmail.com",
              "33919853+se7enbrc@users.noreply.github.com",
          }
          failures = 0
          for sha in commits:
              name, email, message = git(
                  "show", "-s", "--format=%an%x00%ae%x00%B", sha,
              ).split("\0", 2)
              if name.casefold() in owner_names and email.casefold() in owner_emails:
                  continue
              trailers = git("interpret-trailers", "--parse", input=message)
              expected = f"Signed-off-by: {name} <{email}>"
              if expected not in trailers.splitlines():
                  print(f"{sha}: missing Signed-off-by matching the author; use git commit -s.")
                  failures += 1
          if failures:
              sys.exit(1)
          print(f"DCO passed for {len(commits)} PR commits (owner commits exempt).")
          PY
