name: Portable checks
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
      - name: Run every portable hook and script fixture
        env:
          GLIMMER_SECRET_SCAN_ALL_FILES: "1"
          SCAN_FROM:
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_FROM" ] && [ "$SCAN_FROM" != 0000000000000000000000000000000000000000 ]; then
            export PRE_COMMIT_FROM_REF="$SCAN_FROM" PRE_COMMIT_TO_REF="$GITHUB_SHA"
          fi
          hk check --all
          scripts/check-spdx.sh
          make test-scripts TEST_PLATFORM=portable COVERAGE=1
      - name: Upload portable coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-portable
          path: build/coverage/python/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
