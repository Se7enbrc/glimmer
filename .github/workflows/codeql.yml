name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A PR update or closure replaces its run; all other events keep independent runs.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.action != 'closed'
    name: Decide what to scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scan: ${{ steps.changes.outputs.scan }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Main, scheduled and dispatched runs scan everything; a pull request skips
      # only the Swift build when it changes nothing that build reads.
      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Decide what to scan
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LANGUAGE: swift
        run: |
          scan=true
          if [ "$LANGUAGE" = swift ] && [ -n "$PR_NUMBER" ]; then
            if paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')" &&
                [ "$(printf '%s\n' "$paths" | wc -l)" -lt 3000 ] &&
                decision="$(printf '%s\n' "$paths" | python3 scripts/codeql-swift-changed.py)" &&
                [ "$decision" = skip ]; then
              scan=false
              echo "No Swift-relevant change; main scans this code when the pull request merges."
            fi
          fi
          printf 'scan=%s\n' "$scan" >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: always() && github.event.action != 'closed'
    name: Analyze (${{ matrix.language }})
    runs-on:
      ${{ matrix.language == 'swift' && needs.changes.outputs.scan == 'true' &&
      'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a successful scope decision
        env:
          DECIDED: ${{ needs.changes.result }}
        run: test "$DECIDED" = success

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Select analysis scope
        id: changes
        env:
          SCAN:
            ${{ matrix.language != 'swift' || needs.changes.outputs.scan ==
            'true' }}
        run: printf 'scan=%s\n' "$SCAN" >> "$GITHUB_OUTPUT"

      - name: Prepare Swift analysis
        if: steps.changes.outputs.scan == 'true' && matrix.language == 'swift'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test "$(uname -m)" = arm64
          # CodeQL's Swift extractor is x86_64, so it needs Rosetta on Apple Silicon.
          # Install before initialization so the installer itself is not traced.
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          printf 'GLIMMER_SWIFTC=%s\n' "$(xcrun --find swiftc)" >> "$GITHUB_ENV"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-codeql.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          SWIFT_USE_INTEGRATED_DRIVER = NO
          SWIFT_ENABLE_COMPILE_CACHE = NO
          COMPILATION_CACHE_ENABLE_CACHING = NO
          COMPILER_INDEX_STORE_ENABLE = NO
          SWIFT_COMPILATION_MODE = wholemodule
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          OTHER_SWIFT_FLAGS = $(inherited) -package-name GlimmerCodeQL
          XCCONFIG
          printf 'SWIFT_EXEC = %s/scripts/codeql-swiftc.sh\n' "$GITHUB_WORKSPACE" >> "$XCODE_XCCONFIG_FILE"
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        id: init
        if: steps.changes.outputs.scan == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          db-location: ${{ runner.temp }}/codeql-databases
          queries: security-extended
          dependency-caching: false
          trap-caching: false

      # Apple's framework declarations are identical for one CodeQL, Xcode and SDK;
      # the extractor skips any trap file that already exists, so seed them.
      - name: Key cached framework extraction
        id: frameworks
        if: steps.changes.outputs.scan == 'true' && matrix.language == 'swift'
        env:
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          DYLD_INSERT_LIBRARIES: ""
        run: |
          # Read versions from files; launching the CodeQL CLI or xcodebuild here costs minutes.
          xcode="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$DEVELOPER_DIR/../version.plist")"
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$(xcrun --sdk macosx --show-sdk-path)/System/Library/CoreServices/SystemVersion.plist")"
          ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          inputs="$CODEQL_VERSION $xcode $sdk $ios_sdk $(cat "$XCODE_XCCONFIG_FILE")"
          headers="$(git ls-files -z '*.h' | xargs -0 shasum -a 256)"
          key="$(printf '%s\n%s\n' "$inputs" "$headers" | shasum -a 256 | cut -c1-32)"
          printf 'key=codeql-swift-frameworks-v2-%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore cached framework extraction
        id: restore
        if: steps.changes.outputs.scan == 'true' && matrix.language == 'swift'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swift-framework-traps
          key: ${{ steps.frameworks.outputs.key }}

      - name: Seed framework extraction
        if:
          steps.changes.outputs.scan == 'true' && matrix.language == 'swift' &&
          steps.restore.outputs.cache-hit == 'true'
        env:
          DYLD_INSERT_LIBRARIES: ""
        run: |
          trap="$RUNNER_TEMP/codeql-databases/swift/trap/swift"
          mkdir -p "$trap"
          cp -R "$RUNNER_TEMP/swift-framework-traps/." "$trap/"
          du -sh "$trap"

      - name: Build both apps, login item and privileged helper
        if: steps.changes.outputs.scan == 'true' && matrix.language == 'swift'
        env:
          # Keep package resolution outside the compiler tracer.
          # Both builds have separate products; the wrapper traces every production compiler.
          DYLD_INSERT_LIBRARIES: ""
        run: |
          make app helper-build CONFIG=Debug SWIFTC="$PWD/scripts/codeql-swiftc.sh" &
          mac=$!
          if [ -f iOS/Makefile ]; then make ios-app CONFIG=Debug; fi &
          ios=$!
          status=0
          wait "$mac" || status=$?
          wait "$ios" || status=$?
          exit "$status"

      # Only imported modules and their lazily extracted declarations are kept;
      # anything built from this checkout is extracted fresh every run.
      - name: Collect framework extraction
        if:
          steps.changes.outputs.scan == 'true' && matrix.language == 'swift' &&
          steps.restore.outputs.cache-hit != 'true'
        env:
          DYLD_INSERT_LIBRARIES: ""
        run: |
          trap="$RUNNER_TEMP/codeql-databases/swift/trap/swift"
          out="$RUNNER_TEMP/swift-framework-traps"
          mkdir -p "$out"
          cp -R "$trap/modules" "$trap/lazy_decls" "$out/"
          find "$out" -path "*${GITHUB_WORKSPACE#/}/*" -delete
          du -sh "$out"

      - name: Save framework extraction
        if:
          steps.changes.outputs.scan == 'true' && matrix.language == 'swift' &&
          steps.restore.outputs.cache-hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/swift-framework-traps
          key: ${{ steps.frameworks.outputs.key }}

      - name: Analyze
        id: analyze
        if: steps.changes.outputs.scan == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload-database: false
          wait-for-processing: true

      - name: Require complete Swift extraction
        id: coverage
        if: steps.changes.outputs.scan == 'true' && matrix.language == 'swift'
        run: |
          python3 scripts/codeql-coverage.py \
            --database "$RUNNER_TEMP/codeql-databases/swift"

      - name: Retain failed Swift extraction diagnostics
        if: failure() && steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-extraction-diagnostics
          path: ${{ runner.temp }}/codeql-results/swift.sarif
          if-no-files-found: error
          retention-days: 1
      # The jobs API binds this upload receipt to its successful run and attempt.
      - name: CodeQL upload ${{ steps.analyze.outputs.sarif-id }}
        if: steps.changes.outputs.scan == 'true'
        env:
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
        run: test -n "$SARIF_ID"
