name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its run; every main commit keeps its own.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-26
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Swift analysis
        if: matrix.language == 'swift'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test "$(uname -m)" = arm64
          # CodeQL's Swift extractor is x86_64, so it needs Rosetta on Apple Silicon.
          # Install before initialization so the installer itself is not traced.
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          printf 'GLIMMER_SWIFTC=%s\n' "$(xcrun --find swiftc)" >> "$GITHUB_ENV"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-codeql.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          SWIFT_USE_INTEGRATED_DRIVER = NO
          SWIFT_ENABLE_COMPILE_CACHE = NO
          COMPILATION_CACHE_ENABLE_CACHING = NO
          COMPILER_INDEX_STORE_ENABLE = NO
          SWIFT_COMPILATION_MODE = wholemodule
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          SWIFT_EXEC = $(SRCROOT)/scripts/codeql-swiftc.sh
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          db-location: ${{ runner.temp }}/codeql-databases
          queries: security-extended
          dependency-caching: false
          trap-caching: false

      # Apple's framework declarations are identical for one CodeQL, Xcode and SDK;
      # the extractor skips any trap file that already exists, so seed them.
      - name: Key cached framework extraction
        id: frameworks
        if: matrix.language == 'swift'
        env:
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
        run: |
          # Read versions from files; launching the CodeQL CLI or xcodebuild here costs minutes.
          xcode="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$DEVELOPER_DIR/../version.plist")"
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$(xcrun --sdk macosx --show-sdk-path)/System/Library/CoreServices/SystemVersion.plist")"
          inputs="$CODEQL_VERSION $xcode $sdk $(cat "$XCODE_XCCONFIG_FILE")"
          headers="$(git ls-files -z '*.h' | xargs -0 shasum -a 256)"
          key="$(printf '%s\n%s\n' "$inputs" "$headers" | shasum -a 256 | cut -c1-32)"
          printf 'key=codeql-swift-frameworks-v1-%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore cached framework extraction
        id: restore
        if: matrix.language == 'swift'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swift-framework-traps
          key: ${{ steps.frameworks.outputs.key }}

      - name: Seed framework extraction
        if:
          matrix.language == 'swift' && steps.restore.outputs.cache-hit ==
          'true'
        run: |
          trap="$RUNNER_TEMP/codeql-databases/swift/trap/swift"
          mkdir -p "$trap"
          cp -R "$RUNNER_TEMP/swift-framework-traps/." "$trap/"
          du -sh "$trap"

      - name: Build app, login item and privileged helper
        if: matrix.language == 'swift'
        env:
          # Keep package resolution outside the compiler tracer.
          # The compiler wrapper restores tracing for every production target.
          DYLD_INSERT_LIBRARIES: ""
        run:
          make app helper-build CONFIG=Debug
          SWIFTC="$PWD/scripts/codeql-swiftc.sh"

      # Only imported modules and their lazily extracted declarations are kept;
      # anything built from this checkout is extracted fresh every run.
      - name: Collect framework extraction
        if:
          matrix.language == 'swift' && steps.restore.outputs.cache-hit !=
          'true'
        run: |
          trap="$RUNNER_TEMP/codeql-databases/swift/trap/swift"
          out="$RUNNER_TEMP/swift-framework-traps"
          mkdir -p "$out"
          cp -R "$trap/modules" "$trap/lazy_decls" "$out/"
          find "$out" -path "*${GITHUB_WORKSPACE#/}/*" -delete
          du -sh "$out"

      - name: Save framework extraction
        if:
          matrix.language == 'swift' && steps.restore.outputs.cache-hit !=
          'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swift-framework-traps
          key: ${{ steps.frameworks.outputs.key }}

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload-database: false

      - name: Require complete Swift extraction
        if: matrix.language == 'swift'
        run: |
          python3 scripts/codeql-coverage.py \
            --database "$RUNNER_TEMP/codeql-databases/swift"
