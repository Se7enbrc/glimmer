name: Release publication

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      rc_tag:
        required: true
        type: string
      candidate_sha:
        type: string
      tooling:
        required: true
        type: string
      artifact:
        type: string
      manifest:
        type: string
      attempt:
        type: string

permissions:
  contents: read

jobs:
  publish:
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      attestations: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TRUSTED_TOOLING_SHA: ${{ inputs.tooling }}
      SIGNED_MANIFEST: ${{ inputs.manifest }}
      SIGNED_ATTEMPT: ${{ inputs.attempt }}
      ACTIONS_STEP_DEBUG:
        ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG:
        ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
    steps:
      - name: Check out trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      # Keep checkout static; only a commit in main history may supply tooling.
      - name: Check out the pinned main tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling }}
        run: |
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$TOOLING_SHA" origin/main || {
            echo "ERR: pinned tooling is not in main history" >&2
            exit 1
          }
          git checkout --detach "$TOOLING_SHA"
      - name: Check source and prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks
      - name: Restore the persisted candidate
        if: inputs.operation == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT: ${{ inputs.artifact }}
        run: |
          python3 scripts/release_download.py signed "$SIGNED_ARTIFACT" "$SIGNED_ATTEMPT"
          python3 scripts/release_publication.py check "$RUNNER_TEMP/signed"
      - name: Verify candidate provenance and unchanged source
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh prepare-promotion
      - name: Mint a scoped release tag token
        if: inputs.operation == 'promote'
        id: tag-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GLIMMER_RC_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLIMMER_RC_APP_PRIVATE_KEY }}
          owner: Se7enbrc
          repositories: glimmer
          permission-contents: write
          permission-workflows: write
      - name: Create final version tag at the verified candidate
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ steps.tag-app.outputs.token }}
          APP_SLUG: ${{ steps.tag-app.outputs.app-slug }}
        run: |
          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          python3 scripts/promote-release.py tag "$RC_TAG" "$CANDIDATE_SHA"
      - name: Select publication credentials
        id: credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.GLIMMER_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY:
            ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_APP_CLIENT_ID" ] && [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'mode=app' >> "$GITHUB_OUTPUT"
            echo 'Publication credentials: GitHub App.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$RELEASE_APP_CLIENT_ID" ] && [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'mode=pat' >> "$GITHUB_OUTPUT"
            echo 'Publication credentials: PAT fallback; both App secrets are absent.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ERR: Configure both publication App secrets; refusing PAT fallback.' >&2
            exit 1
          fi
      - name: Mint publication token for glimmer only
        if: steps.credentials.outputs.mode == 'app'
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GLIMMER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
          owner: Se7enbrc
          repositories: glimmer
          permission-contents: write
      - name: Publish candidate or promote accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          # Migration fallback only: remove after the App completes a normal release and tap update.
          RELEASE_CONTENTS_TOKEN:
            ${{ steps.credentials.outputs.mode == 'pat' &&
            secrets.RELEASE_CONTENTS_TOKEN ||
            steps.publication-token.outputs.token }}
        run: |
          case "$RELEASE_OPERATION" in
            candidate) scripts/ci-release.sh publish ;;
            promote) scripts/ci-release.sh promote ;;
            *) exit 1 ;;
          esac
      - name: Remove temporary credentials
        if: always()
        run: scripts/ci-release.sh cleanup
      - name: Record publication visibility even after a feed failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/glimmer-publication-state" ]; then
            cat "$RUNNER_TEMP/glimmer-publication-state" >> "$GITHUB_STEP_SUMMARY"
          fi

  tap:
    needs: publish
    if: inputs.operation == 'promote'
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      attestations: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: promote
      RC_TAG: ${{ inputs.rc_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TRUSTED_TOOLING_SHA: ${{ inputs.tooling }}
      ACTIONS_STEP_DEBUG:
        ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG:
        ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
    steps:
      - name: Check out trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      # Keep checkout static; only a commit in main history may supply tooling.
      - name: Check out the pinned main tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling }}
        run: |
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$TOOLING_SHA" origin/main || {
            echo "ERR: pinned tooling is not in main history" >&2
            exit 1
          }
          git checkout --detach "$TOOLING_SHA"
      - name: Reverify the published candidate before touching the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci-release.sh checks
          scripts/ci-release.sh prepare-promotion
      - name: Select publication credentials
        id: credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.GLIMMER_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY:
            ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_APP_CLIENT_ID" ] && [ -n "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'mode=app' >> "$GITHUB_OUTPUT"
            echo 'Publication credentials: GitHub App.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$RELEASE_APP_CLIENT_ID" ] && [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo 'mode=pat' >> "$GITHUB_OUTPUT"
            echo 'Publication credentials: PAT fallback; both App secrets are absent.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ERR: Configure both publication App secrets; refusing PAT fallback.' >&2
            exit 1
          fi
      - name: Mint tap token for homebrew-glimmer only
        if: steps.credentials.outputs.mode == 'app'
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GLIMMER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
          owner: Se7enbrc
          repositories: homebrew-glimmer
          permission-contents: write
      - name: Update Homebrew from verified published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          # Migration fallback only: remove with the publication fallback after App acceptance.
          RELEASE_CONTENTS_TOKEN:
            ${{ steps.credentials.outputs.mode == 'pat' &&
            secrets.RELEASE_CONTENTS_TOKEN || steps.tap-token.outputs.token }}
        run: |
          scripts/ci-release.sh tap
      - name: Remove temporary credentials
        if: always()
        run: scripts/ci-release.sh cleanup
