name: Release publication

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      rc_tag:
        required: true
        type: string
      candidate_sha:
        type: string
      tooling:
        required: true
        type: string
      artifact:
        type: string
      manifest:
        type: string
      attempt:
        type: string

permissions:
  contents: read

jobs:
  publish:
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      attestations: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TRUSTED_TOOLING_SHA: ${{ inputs.tooling }}
      SIGNED_MANIFEST: ${{ inputs.manifest }}
      SIGNED_ATTEMPT: ${{ inputs.attempt }}
      RELEASE_APP_ID: ${{ secrets.GLIMMER_RELEASE_APP_ID }}
      ACTIONS_STEP_DEBUG:
        ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG:
        ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
    steps:
      - name: Check out trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check source and prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks
      - name: Restore the persisted candidate
        if: inputs.operation == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT: ${{ inputs.artifact }}
        run: |
          python3 scripts/release_download.py signed "$SIGNED_ARTIFACT" "$SIGNED_ATTEMPT"
          python3 scripts/release_publication.py check "$RUNNER_TEMP/signed"
      - name: Verify candidate provenance and unchanged source
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh prepare-promotion
      - name: Mint publication token for glimmer only
        if: env.RELEASE_APP_ID != ''
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GLIMMER_RELEASE_APP_ID }}
          private-key: ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
          owner: Se7enbrc
          repositories: glimmer
          permission-contents: write
      - name: Publish candidate or promote accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.publication-token.outputs.token }}
          # Migration fallback only: remove after the App completes a normal release and tap update.
          RELEASE_CONTENTS_TOKEN:
            ${{ env.RELEASE_APP_ID != '' &&
            steps.publication-token.outputs.token ||
            secrets.RELEASE_CONTENTS_TOKEN }}
        run: |
          if [ -n "$RELEASE_APP_ID" ] && [ -z "$APP_TOKEN" ]; then exit 1; fi
          case "$RELEASE_OPERATION" in
            candidate) scripts/ci-release.sh publish ;;
            promote) scripts/ci-release.sh promote ;;
            *) exit 1 ;;
          esac
      - name: Remove temporary credentials
        if: always()
        run: scripts/ci-release.sh cleanup
      - name: Record publication visibility even after a feed failure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/glimmer-publication-state" ]; then
            cat "$RUNNER_TEMP/glimmer-publication-state" >> "$GITHUB_STEP_SUMMARY"
          fi

  tap:
    needs: publish
    if: inputs.operation == 'promote'
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: read
      attestations: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: promote
      RC_TAG: ${{ inputs.rc_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TRUSTED_TOOLING_SHA: ${{ inputs.tooling }}
      RELEASE_APP_ID: ${{ secrets.GLIMMER_RELEASE_APP_ID }}
      ACTIONS_STEP_DEBUG:
        ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG:
        ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
    steps:
      - name: Check out trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling }}
          persist-credentials: false
          fetch-depth: 0
      - name: Reverify the published candidate before touching the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci-release.sh checks
          scripts/ci-release.sh prepare-promotion
      - name: Mint tap token for homebrew-glimmer only
        if: env.RELEASE_APP_ID != ''
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GLIMMER_RELEASE_APP_ID }}
          private-key: ${{ secrets.GLIMMER_RELEASE_APP_PRIVATE_KEY }}
          owner: Se7enbrc
          repositories: homebrew-glimmer
          permission-contents: write
      - name: Update Homebrew from verified published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Migration fallback only: remove with the publication fallback after App acceptance.
          RELEASE_CONTENTS_TOKEN:
            ${{ env.RELEASE_APP_ID != '' && steps.tap-token.outputs.token ||
            secrets.RELEASE_CONTENTS_TOKEN }}
        run: |
          if [ -n "$RELEASE_APP_ID" ] && [ -z "$APP_TOKEN" ]; then exit 1; fi
          scripts/ci-release.sh tap
      - name: Remove temporary credentials
        if: always()
        run: scripts/ci-release.sh cleanup
