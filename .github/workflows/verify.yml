name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its run; every main commit keeps its own.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The gate's three parts share no build products, so they run side by side.
  verify:
    name: Verify (${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: checks
            target: check
          - part: tests
            target: test
          - part: fuzz
            target: test-asan
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          python3 --version

      - name: Prepare verification
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          if ! command -v actionlint >/dev/null 2>&1; then
            brew install actionlint
          fi
          if ! command -v pre-commit >/dev/null 2>&1; then
            brew install pre-commit
          fi
          scripts/install-ci-scanner.sh
          swiftlint version
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-ci.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Pre-commit
        id: precommit
        if: matrix.part == 'checks'
        env:
          GLIMMER_SECRET_SCAN_ALL_FILES: "1"
          SCAN_FROM:
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_FROM" ] && [ "$SCAN_FROM" != 0000000000000000000000000000000000000000 ]; then
            export PRE_COMMIT_FROM_REF="$SCAN_FROM"
            export PRE_COMMIT_TO_REF="$GITHUB_SHA"
          fi
          pre-commit run --all-files

      - name: Verify
        id: verify
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET" TEST_SUITE=

      - name: Failure summary
        if: failure()
        env:
          TESTED_SHA: ${{ github.sha }}
          PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PART: ${{ matrix.part }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            printf '## Verification failed\n\n'
            printf 'Tested commit: %s\n\n' "$TESTED_SHA"
            printf '| Check | Outcome | Reproduce locally |\n'
            printf '| --- | --- | --- |\n'
            printf '| Pre-commit | %s | GLIMMER_SECRET_SCAN_ALL_FILES=1 pre-commit run --all-files |\n' "$PRECOMMIT_OUTCOME"
            printf '| %s | %s | make %s |\n\n' "$PART" "$VERIFY_OUTCOME" "$TARGET"
            printf 'Check out the tested commit and open the failed step for details.\n'
            printf 'Credential scanner findings are withheld; never paste keys or tokens into an issue.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check: green only when every part of the gate passed.
  gate:
    name: macOS
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
