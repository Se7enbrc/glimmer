name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its run; every main commit keeps its own.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Main and dispatched runs build everything; a pull request skips the build and
  # tests only when it changes nothing but documentation and the website.
  changes:
    name: Decide what to verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      parts: ${{ steps.decide.outputs.parts }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ -n "$PR_NUMBER" ]; then
            if paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')" &&
                [ "$(printf '%s\n' "$paths" | wc -l)" -lt 3000 ] &&
                decision="$(printf '%s\n' "$paths" | python3 scripts/verify-changed.py)" &&
                [ "$decision" = skip ]; then
              build=false
              echo "Documentation only; the build and tests run when main gets it."
            fi
          fi
          checks='{"part":"checks","target":"check","coverage":"python"}'
          tests='{"part":"tests","target":"test","coverage":"swift"}'
          fuzz='{"part":"fuzz","target":"test-asan","coverage":""}'
          if [ "$build" = true ]; then parts="[$checks,$tests,$fuzz]"; else parts="[$checks]"; fi
          printf 'build=%s\nparts=%s\n' "$build" "$parts" >> "$GITHUB_OUTPUT"

  # The gate's parts share no build products, so they run side by side.
  verify:
    name: Verify (${{ matrix.part }})
    needs: changes
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.parts) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          python3 --version

      - name: Select verification Python
        if: matrix.part == 'checks'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.8"
          architecture: arm64

      - name: Prepare verification
        env:
          COVERAGE_KIND: ${{ matrix.coverage }}
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = checks ]; then
            for tool in swiftlint actionlint pre-commit; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                brew install "$tool"
              fi
            done
            scripts/install-ci-scanner.sh
            swiftlint version
          fi
          if [ "$COVERAGE_KIND" = python ]; then
            python3 -m venv "$RUNNER_TEMP/coverage"
            "$RUNNER_TEMP/coverage/bin/python" -m pip install --quiet --require-hashes \
              --only-binary :all: -r scripts/coverage-requirements.txt
          fi
          printf 'HOOK_PYTHON=%s\n' "$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-ci.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Restore hook environments
        if: matrix.part == 'checks'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key:
            ${{ runner.os }}-${{ runner.arch }}-hooks-v1-${{ env.HOOK_PYTHON
            }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        id: precommit
        if: matrix.part == 'checks'
        env:
          GLIMMER_SECRET_SCAN_ALL_FILES: "1"
          SCAN_FROM:
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_FROM" ] && [ "$SCAN_FROM" != 0000000000000000000000000000000000000000 ]; then
            export PRE_COMMIT_FROM_REF="$SCAN_FROM"
            export PRE_COMMIT_TO_REF="$GITHUB_SHA"
          fi
          pre-commit run --all-files

      - name: Save trusted hook environments
        if:
          matrix.part == 'checks' && github.event_name == 'push' && github.ref
          == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key:
            ${{ runner.os }}-${{ runner.arch }}-hooks-v1-${{ env.HOOK_PYTHON
            }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Verify
        id: verify
        env:
          TARGET: ${{ matrix.target }}
          COVERAGE_KIND: ${{ matrix.coverage }}
          COVERAGE_PY: ${{ runner.temp }}/coverage/bin/python -m coverage
        run: make "$TARGET" TEST_SUITE= ${COVERAGE_KIND:+COVERAGE=1}

      - name: Coverage summary
        if: matrix.coverage != ''
        env:
          TESTED_SHA: ${{ github.sha }}
          COVERAGE_KIND: ${{ matrix.coverage }}
        run: |
          {
            printf 'Measured commit: %s\n\n' "$TESTED_SHA"
            cat "build/coverage/$COVERAGE_KIND/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.coverage != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.coverage }}
          path: build/coverage/${{ matrix.coverage }}/
          if-no-files-found: error
          retention-days: 30

      - name: Failure summary
        if: failure()
        env:
          TESTED_SHA: ${{ github.sha }}
          PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PART: ${{ matrix.part }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            printf '## Verification failed\n\n'
            printf 'Tested commit: %s\n\n' "$TESTED_SHA"
            printf '| Check | Outcome | Reproduce locally |\n'
            printf '| --- | --- | --- |\n'
            printf '| Pre-commit | %s | GLIMMER_SECRET_SCAN_ALL_FILES=1 pre-commit run --all-files |\n' "$PRECOMMIT_OUTCOME"
            printf '| %s | %s | make %s |\n\n' "$PART" "$VERIFY_OUTCOME" "$TARGET"
            printf 'Check out the tested commit and open the failed step for details.\n'
            printf 'Credential scanner findings are withheld; never paste keys or tokens into an issue.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  engine-ios:
    name: Engine iOS
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the source package
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors

      - name: Build engine for device and Simulator
        run: |
          xcodebuild -version
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            xcodebuild -project Glimmer.xcodeproj -scheme GlimmerEngine -configuration Release \
              -destination "$destination" -derivedDataPath build/engine-ios \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES build
          done

  ios:
    name: iOS (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Simulator, device]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test iPhone app against this checkout
        if: matrix.platform == 'Simulator'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iOS/build/logs
          destination=$(scripts/ci-ios-simulator.sh)
          make ios-test TEST_DESTINATION="$destination" \
            TEST_FLAGS='-enableCodeCoverage YES -resultBundlePath build/CI-tests.xcresult' \
            2>&1 | tee iOS/build/logs/test.log
          if grep -E '(^|[[:space:]])warning:' iOS/build/logs/test.log; then exit 1; fi
          xcrun xccov view --report --json iOS/build/CI-tests.xcresult > iOS/build/logs/coverage.json
          xcrun xccov view --report iOS/build/CI-tests.xcresult > iOS/build/logs/coverage.txt
          {
            printf '### iOS Simulator coverage\n\n```text\n'
            cat iOS/build/logs/coverage.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build production iPhone app without signing
        if: matrix.platform == 'device'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iOS/build/logs
          make ios-device 2>&1 | tee iOS/build/logs/device.log
          if grep -E '(^|[[:space:]])warning:' iOS/build/logs/device.log; then exit 1; fi

      - name: Save iOS results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.platform }}-results
          path: |
            iOS/build/logs/
            iOS/build/CI-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # The oldest supported macOS runs the unit tests so its fallback paths execute.
  # They compile once with the pinned Xcode; macOS 15's image only runs them.
  sequoia-build:
    name: Verify (sequoia build)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the unit tests for macOS 15.7
        run: |
          make test-build
          tar -C build/Build -czf "$RUNNER_TEMP/sequoia-tests.tgz" Products

      - name: Hand the test products to the macOS 15 runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequoia-tests
          path: ${{ runner.temp }}/sequoia-tests.tgz
          if-no-files-found: error
          retention-days: 1

  sequoia:
    name: Verify (sequoia)
    needs: [changes, sequoia-build]
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Runs, never compiles: the image's newest Xcode is 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Receive the test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sequoia-tests
          path: ${{ runner.temp }}

      - name: Run the unit tests on macOS 15
        run: |
          sw_vers
          mkdir -p build/Build
          tar -C build/Build -xzf "$RUNNER_TEMP/sequoia-tests.tgz"
          make test-run

  fuzz:
    name: libFuzzer
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fuzz protocol parsers
        env:
          FUZZ_SECONDS: "30"
        run: scripts/fuzz.sh
  # The required check: green only when every part of the gate passed.
  gate:
    name: macOS
    needs: [changes, verify, engine-ios, ios, sequoia]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          DECIDED: ${{ needs.changes.result }}
          RESULT: ${{ needs.verify.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          ENGINE: ${{ needs.engine-ios.result }}
          IOS: ${{ needs.ios.result }}
          SEQUOIA: ${{ needs.sequoia.result }}
        run: |
          test "$DECIDED" = success
          test "$RESULT" = success
          if [ "$BUILD" = true ]; then
            test "$ENGINE" = success
            test "$IOS" = success
            test "$SEQUOIA" = success
          elif [ "$BUILD" = false ]; then
            test "$ENGINE" = skipped
            test "$IOS" = skipped
            test "$SEQUOIA" = skipped
          else
            exit 1
          fi
