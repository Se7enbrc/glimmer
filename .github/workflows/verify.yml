name: Verify

on:
  push:
    branches: [main, feat/2026.10.8]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  actions: read

# A PR update or closure replaces its run; all other events keep independent runs.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Main and dispatched runs build everything; a pull request skips the build and
  # tests only for documentation or verified numeric version metadata.
  changes:
    if: github.event.action != 'closed'
    name: Decide what to verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      apple: ${{ steps.decide.outputs.apple }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          apple=false
          if [ -f Package.swift ] || [ -d GlimmerEngine ] || [ -f iOS/Makefile ]; then
            test -f Package.swift && test -f iOS/Makefile && test -d GlimmerEngine
            apple=true
          fi
          printf 'apple=%s\n' "$apple" >> "$GITHUB_OUTPUT"
          build=true
          if [ -n "$PR_NUMBER" ]; then
            if paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')" &&
                [ "$(printf '%s\n' "$paths" | wc -l)" -lt 3000 ] &&
                decision="$(printf '%s\n' "$paths" | python3 scripts/verify-changed.py)" &&
                [ "$decision" = skip ]; then
              build=false
              echo "Documentation or numeric version metadata only; main still runs the full gate."
            fi
          fi
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"

  # Mac and iOS core workers progress independently; no Apple job matrix.
  verify:
    name: Verify (Mac build and core)
    needs: changes
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swift --version
          python3 --version

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]

      - name: Prepare verification
        run: |
          printf 'HOOK_PYTHON=%s\n' "$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-ci.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          COMPILATION_CACHE_ENABLE_CACHING = YES
          COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS = YES
          SWIFT_SUPPRESS_WARNINGS = NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Restore compiler and dependency caches
        id: build-cache
        # Same-ref repository code; no external checkout or action mutation precedes this call.
        uses: ./.github/actions/build-cache # zizmor: ignore[self-repository]
        with:
          variant: core

      - name: Build the shared Mac test products
        if: needs.changes.outputs.build == 'true'
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p build/logs
          python3 scripts/ci-local.py mac --build-only
          tar -C build/Build -czf "$RUNNER_TEMP/sequoia-tests.tgz" Products

      - name: Hand the test products to the macOS 15 runner
        if: needs.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequoia-tests
          path: ${{ runner.temp }}/sequoia-tests.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Check native tooling
        timeout-minutes: 10
        run: make check-macos TEST_SUITE= COVERAGE=1

      - name: Run Mac tests
        if: needs.changes.outputs.build == 'true'
        timeout-minutes: 20
        run: python3 scripts/ci-local.py mac --run-only

      - name: Save Mac results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-results
          path: |
            build/logs/
            build/Logs/Test/
            build/coverage/swift/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload script coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-macos
          path: build/coverage/python/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Upload Swift coverage
        if: always() && needs.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-swift-macos
          path: build/coverage/swift/
          if-no-files-found: error
          retention-days: 1

      - name: Save compiler and dependency caches
        if: success() && steps.build-cache.outputs.hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}

  ios-core:
    name: Verify (iOS build and core)
    needs: changes
    if:
      needs.changes.outputs.build == 'true' && needs.changes.outputs.apple ==
      'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]

      - name: Restore compiler and dependency caches
        id: build-cache
        # Same-ref repository code; only unsigned compiler and dependency state.
        uses: ./.github/actions/build-cache # zizmor: ignore[self-repository]
        with:
          variant: ios-core

      - name: Enable compiler caching
        run:
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/glimmer-cache.xcconfig" >>
          "$GITHUB_ENV"

      - name: Build and test the source package
        if:
          needs.changes.outputs.build == 'true' && needs.changes.outputs.apple
          == 'true'
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build/logs
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build/logs/package-build.log
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee build/logs/package-test.log

      - name: Build engine for device and Simulator
        if:
          needs.changes.outputs.build == 'true' && needs.changes.outputs.apple
          == 'true'
        timeout-minutes: 5
        run: |
          xcodebuild -version
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            xcodebuild -project Glimmer.xcodeproj -scheme GlimmerEngine -configuration Release \
              -destination "$destination" -derivedDataPath build/engine-ios \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES build
          done

      - name: Build production iPhone app without signing
        timeout-minutes: 10
        if:
          needs.changes.outputs.build == 'true' && needs.changes.outputs.apple
          == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iOS/build/logs
          make ios-device 2>&1 | tee iOS/build/logs/device.log
          if grep -E '(^|[[:space:]])warning:' iOS/build/logs/device.log; then exit 1; fi

      - name: Save package results
        if:
          always() && needs.changes.outputs.build == 'true' &&
          needs.changes.outputs.apple == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-package-results
          path: |
            build/logs/
            iOS/build/logs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Build Simulator tests and run core
        if:
          needs.changes.outputs.build == 'true' && needs.changes.outputs.apple
          == 'true'
        timeout-minutes: 25
        run: |
          python3 scripts/ci-local.py core
          tar -C iOS/build/ci/DerivedData/Build -czf "$RUNNER_TEMP/ios-tests.tgz" Products

      - name: Share the Simulator test products
        if:
          needs.changes.outputs.build == 'true' && needs.changes.outputs.apple
          == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-tests
          path: ${{ runner.temp }}/ios-tests.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Save core results
        if: always() && needs.changes.outputs.apple == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core-results
          path: iOS/build/ci/core/
          if-no-files-found: ignore
          retention-days: 1
      - name: Save compiler and dependency caches
        if: success() && steps.build-cache.outputs.hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}

  # Full validation starts after Tier 1; no unbounded Apple runner matrix.
  extended:
    name: Verify (render, journeys and sanitizers)
    needs: [changes, gate]
    if:
      github.event_name != 'pull_request' && needs.changes.outputs.build ==
      'true'
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]

      - name: Receive Simulator test products
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-tests
          path: ${{ runner.temp }}

      - name: Render and UI tests
        if: needs.changes.outputs.apple == 'true'
        timeout-minutes: 40
        run: |
          mkdir -p iOS/build/ci/DerivedData/Build
          tar -C iOS/build/ci/DerivedData/Build -xzf "$RUNNER_TEMP/ios-tests.tgz"
          python3 scripts/ci-local.py render --run-only

      - name: User journeys
        if: ${{ !cancelled() && needs.changes.outputs.apple == 'true' }}
        timeout-minutes: 45
        run: |
          if [ -f scripts/ios-touch-journeys.sh ] || [ -f scripts/mac-controller-journeys.sh ] ||
              [ -f iOS/Glimmer.xcodeproj/xcshareddata/xcschemes/Glimmer-Touch-Journeys.xcscheme ]; then
            test -f iOS/Glimmer.xcodeproj/xcshareddata/xcschemes/Glimmer-Touch-Journeys.xcscheme
            test -f Glimmer.xcodeproj/xcshareddata/xcschemes/Glimmer-Controller-Journeys.xcscheme
            python3 scripts/ci-local.py journeys
          fi

      - name: Address sanitizer and deterministic fuzz tests
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p build/logs
          make test-asan 2>&1 | tee build/logs/asan.log

      - name: Save extended results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-results
          path: |
            iOS/build/ci/render/
            build/logs/
            build/Logs/Test/
            build/controller-journey-results/
            iOS/build/touch-journey-results/
          if-no-files-found: ignore
          retention-days: 1

  tier2:
    name: Tier 2
    needs: [gate, extended]
    if:
      always() && github.event_name != 'pull_request' && github.event.action !=
      'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete validation on this commit
        env:
          CORE: ${{ needs.gate.result }}
          EXTENDED: ${{ needs.extended.result }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          test "$CORE" = success
          test "$EXTENDED" = success
          printf 'Tier 2 verified commit: %s\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Run the same instrumented products on the oldest supported macOS.
  sequoia:
    name: Verify (sequoia)
    needs: [changes, verify]
    if:
      needs.changes.outputs.build == 'true' && needs.changes.outputs.apple ==
      'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Runs, never compiles: the image's newest Xcode is 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Receive the test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sequoia-tests
          path: ${{ runner.temp }}

      - name: Run the unit tests on macOS 15
        timeout-minutes: 10
        run: |
          set -o pipefail
          sw_vers
          mkdir -p build/Build build/logs
          tar -C build/Build -xzf "$RUNNER_TEMP/sequoia-tests.tgz"
          status=0
          make test-run TEST_FLAGS='-resultBundlePath build/sequoia.xcresult' \
            2>&1 | tee build/logs/sequoia.log || status=$?
          python3 scripts/ci-local.py mac --validate-result build/sequoia.xcresult || status=1
          python3 scripts/ci-test-results.py mac build/sequoia.xcresult build/logs/sequoia.log "$status"
          exit "$status"

      - name: Save macOS 15 results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequoia-results
          path: |
            build/logs/
            build/sequoia.xcresult
          if-no-files-found: ignore
          retention-days: 1

  fuzz:
    name: libFuzzer
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Fuzz protocol parsers
        timeout-minutes: 4
        env:
          FUZZ_SECONDS: "30"
        run: |
          set -o pipefail
          mkdir -p build/logs
          scripts/fuzz.sh 2>&1 | tee build/logs/fuzz.log

      - name: Save fuzzer results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-results
          path: |
            build/logs/
            build/fuzz/
          if-no-files-found: ignore
          retention-days: 1
  checks:
    name: Portable checks
    needs: changes
    # Same-ref repository code; no external checkout or action mutation precedes this call.
    uses: ./.github/workflows/portable-checks.yml # zizmor: ignore[self-repository]

  # The required check: green only when every part of the gate passed.
  gate:
    name: macOS
    needs: [changes, checks, verify, ios-core, sequoia, fuzz]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          DECIDED: ${{ needs.changes.result }}
          RESULT: ${{ needs.verify.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          APPLE: ${{ needs.changes.outputs.apple }}
          CHECKS: ${{ needs.checks.result }}
          IOS_CORE: ${{ needs.ios-core.result }}
          SEQUOIA: ${{ needs.sequoia.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          test "$DECIDED" = success
          test "$RESULT" = success
          test "$CHECKS" = success
          case "$APPLE" in true|false) ;; *) exit 1 ;; esac
          case "$BUILD" in
            true) test "$FUZZ" = success ;;
            false) test "$FUZZ" = skipped ;;
            *) exit 1 ;;
          esac
          if [ "$BUILD" = true ] && [ "$APPLE" = true ]; then
            test "$IOS_CORE" = success
            test "$SEQUOIA" = success
          else
            test "$IOS_CORE" = skipped
            test "$SEQUOIA" = skipped
          fi

      - name: Check out coverage tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare coverage tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:astral-sh/uv pipx:coverage aqua:cli/cli
      - name: Receive every script coverage partition
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-python-*
          path: build/coverage/parts
      - name: Combine complete script coverage
        run: |
          export COVERAGE_PY=coverage
          mkdir -p build/coverage/python
          cp build/coverage/parts/coverage-python-portable/.coverage build/coverage/python/.coverage.portable
          cp build/coverage/parts/coverage-python-macos/.coverage build/coverage/python/.coverage.macos
          python3 scripts/coverage-report.py python
          cat build/coverage/python/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete script coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: build/coverage/python/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
