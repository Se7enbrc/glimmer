name: Verify
run-name: ${{ inputs.mode == 'acceptance' && 'Release acceptance' || 'Verify' }}

on:
  push:
    branches: [main, feat/2026.10.8]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: Fast verification or resumable release acceptance
        type: choice
        options: [verify, acceptance]
        default: verify
      release:
        description: Acceptance milestone, for example 2026.10.8
        type: string
      resume_run:
        description: Previous acceptance run ID whose ledger should be resumed
        type: string
      rerun:
        description:
          Affected case patterns, space separated (for example
          iphone/*/*Rotation*)
        type: string
      only:
        description:
          Limit acceptance to matching case patterns (for example mac/*
          iphone/*/*Rotation*)
        type: string

permissions:
  contents: read
  actions: read

# A PR update or closure replaces its run; all other events keep independent runs.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Use the tested merge tree for PR routing. Main and RC run the full suite.
  changes:
    if: github.event.action != 'closed'
    name: Decide what to verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple_runner: ${{ steps.runner.outputs.label }}
      jobs: ${{ steps.decide.outputs.jobs }}
      tasks: ${{ steps.decide.outputs.tasks }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select the Apple runner
        id: runner
        run:
          python3 scripts/verify-changed.py --apple-runner >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/verify-changed.py --plan >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Build Mac test products and check native tooling
    needs: changes
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'verify')
    runs-on: ${{ needs.changes.outputs.apple_runner }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify M4 admission
        if: runner.environment == 'self-hosted'
        env:
          GLIMMER_M4_ADMISSION: ${{ secrets.GLIMMER_M4_ADMISSION }}
        run: /Library/GlimmerActions/accept-job.sh --require-proof

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]

      - name: Prepare verification
        run: |
          test "$(uname -m)" = arm64
          printf 'HOOK_PYTHON=%s\n' "$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-ci.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          COMPILATION_CACHE_ENABLE_CACHING = YES
          COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS = YES
          SWIFT_SUPPRESS_WARNINGS = NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Restore compiler and dependency caches
        if: contains(fromJSON(needs.changes.outputs.tasks), 'mac')
        id: build-cache
        # Same-ref repository code; no external checkout or action mutation precedes this call.
        uses: ./.github/actions/build-cache # zizmor: ignore[self-repository]
        with:
          variant: core

      - name: Build the shared Mac test products
        if: contains(fromJSON(needs.changes.outputs.tasks), 'mac')
        timeout-minutes: 10
        run: |
          python3 scripts/ci-local.py mac --build-only

      - name: Archive Mac test products for desktop runs
        if: contains(fromJSON(needs.changes.outputs.jobs), 'mac-core')
        run:
          tar -C build/Build -czf "$RUNNER_TEMP/mac-test-products.tgz" Products

      - name: Share the Mac test products
        if: contains(fromJSON(needs.changes.outputs.jobs), 'mac-core')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-test-products
          compression-level: 0
          path: ${{ runner.temp }}/mac-test-products.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Check native tooling
        timeout-minutes: 10
        run: make check-macos-tools TEST_SUITE= COVERAGE=1

      - name: Save failed Mac build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-build-results
          path: build/[Ll]ogs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload script coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-macos
          path: build/coverage/python/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Save compiler and dependency caches
        if:
          success() && steps.build-cache.outcome == 'success' &&
          steps.build-cache.outputs.hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}

  mac-core:
    name: Verify (Mac core)
    needs: [changes, verify]
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'mac-core')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python
          cache: "false"

      - name: Receive the test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-test-products
          path: ${{ runner.temp }}

      - name: Run Mac tests
        timeout-minutes: 20
        run: |
          mkdir -p build/Build
          tar -C build/Build -xzf "$RUNNER_TEMP/mac-test-products.tgz"
          python3 scripts/ci-local.py mac --run-only

      - name: Save Mac results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-results
          path: |
            build/logs/
            build/Logs/Test/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Swift coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-swift-macos
          path: build/coverage/swift/
          if-no-files-found: error
          retention-days: 1

  apple-builds:
    name: Verify (package and production builds)
    needs: changes
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'apple-builds')
    runs-on: ${{ needs.changes.outputs.apple_runner }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Verify M4 admission
        if: runner.environment == 'self-hosted'
        env:
          GLIMMER_M4_ADMISSION: ${{ secrets.GLIMMER_M4_ADMISSION }}
        run: /Library/GlimmerActions/accept-job.sh --require-proof

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Restore compiler and dependency caches
        id: build-cache
        # Same-ref repository code; only unsigned compiler and dependency state.
        uses: ./.github/actions/build-cache # zizmor: ignore[self-repository]
        with:
          variant: apple-builds

      - name: Build and test the source package
        if: contains(fromJSON(needs.changes.outputs.tasks), 'package')
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build/logs
          make check-package-boundary
          package_flags=()
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then package_flags=(--disable-sandbox); fi
          swift build "${package_flags[@]}" -Xswiftc -warnings-as-errors 2>&1 | tee build/logs/package-build.log
          swift test "${package_flags[@]}" -Xswiftc -warnings-as-errors 2>&1 | tee build/logs/package-test.log

      - name: Build engine for device and Simulator
        if: contains(fromJSON(needs.changes.outputs.tasks), 'package')
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/glimmer-cache.xcconfig
        # Cold device plus Simulator builds have taken nearly five minutes.
        timeout-minutes: 8
        run: |
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            xcodebuild -project Glimmer.xcodeproj -scheme GlimmerEngine -configuration Release \
              -destination "$destination" -derivedDataPath build/engine-ios \
              CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES build
          done

      - name: Build production iPhone app without signing
        if: contains(fromJSON(needs.changes.outputs.tasks), 'device')
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/glimmer-cache.xcconfig
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p iOS/build/logs
          make ios-device 2>&1 | tee iOS/build/logs/device.log
          if grep -E '(^|[[:space:]])warning:' iOS/build/logs/device.log; then exit 1; fi

      - name: Save package results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-package-results
          path: |
            build/logs/
            iOS/build/logs/
          if-no-files-found: ignore
          retention-days: 1

      - name: Save compiler and dependency caches
        if: success() && steps.build-cache.outputs.hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}

  ios-core:
    name: Verify (iOS Simulator core)
    needs: changes
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'ios-core')
    runs-on: ${{ needs.changes.outputs.apple_runner }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Verify M4 admission
        if: runner.environment == 'self-hosted'
        env:
          GLIMMER_M4_ADMISSION: ${{ secrets.GLIMMER_M4_ADMISSION }}
        run: /Library/GlimmerActions/accept-job.sh --require-proof

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Restore compiler and dependency caches
        id: build-cache
        # Same-ref repository code; only unsigned compiler and dependency state.
        uses: ./.github/actions/build-cache # zizmor: ignore[self-repository]
        with:
          variant: ios-core

      - name: Build Simulator tests and run core
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/glimmer-cache.xcconfig
          XCTEST_DEVELOPER_DIR:
            ${{ runner.environment == 'self-hosted' &&
            '/Applications/Xcode_27.2.app/Contents/Developer' || '' }}
        timeout-minutes: 25
        run: python3 scripts/ci-local.py core

      - name: Save core results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core-results
          path: iOS/build/ci/core/
          if-no-files-found: ignore
          retention-days: 1
      - name: Save compiler and dependency caches
        if: success() && steps.build-cache.outputs.hit != 'true'
        # Same-ref action receives only unsigned cache paths.
        uses: ./.github/actions/cache-save # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build-cache.outputs.paths }}
          key: ${{ steps.build-cache.outputs.key }}

  # Acceptance retains reviewed case history across RCs; it is never a candidate gate.
  extended:
    name: Release acceptance
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'acceptance'
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned tools
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]

      - name: Resume acceptance history
        if: inputs.resume_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-ledger
          path: build/acceptance
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: Run pending or affected acceptance cases
        timeout-minutes: 90
        env:
          ACCEPTANCE_RELEASE: ${{ inputs.release }}
          ACCEPTANCE_RERUN: ${{ inputs.rerun }}
          ACCEPTANCE_ONLY: ${{ inputs.only }}
        run: python3 scripts/ci-local.py acceptance

      - name: Preserve acceptance ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-ledger
          path: |
            build/acceptance/ledger.json
            build/acceptance/summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Save hosted acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results
          path: |
            build/acceptance/
            iOS/build/ci/render/
            build/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Run the same instrumented products on the oldest supported macOS.
  sequoia:
    name: Verify (sequoia)
    needs: [changes, verify]
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'sequoia')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Runs, never compiles: the image's newest Xcode is 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Receive the test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-test-products
          path: ${{ runner.temp }}

      - name: Run the unit tests on macOS 15
        timeout-minutes: 10
        run: |
          set -o pipefail
          sw_vers
          mkdir -p build/Build build/logs
          tar -C build/Build -xzf "$RUNNER_TEMP/mac-test-products.tgz"
          status=0
          make test-run TEST_FLAGS='-resultBundlePath build/sequoia.xcresult' \
            2>&1 | tee build/logs/sequoia.log || status=$?
          python3 scripts/ci-local.py mac --validate-result build/sequoia.xcresult || status=1
          python3 scripts/ci-test-results.py mac build/sequoia.xcresult build/logs/sequoia.log "$status"
          exit "$status"

      - name: Save macOS 15 results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequoia-results
          path: |
            build/logs/
            build/sequoia.xcresult
          if-no-files-found: ignore
          retention-days: 1

  fuzz:
    name: libFuzzer
    needs: changes
    if:
      inputs.mode != 'acceptance' &&
      contains(fromJSON(needs.changes.outputs.jobs), 'fuzz')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Fuzz protocol parsers
        timeout-minutes: 4
        env:
          FUZZ_SECONDS: "30"
        run: |
          set -o pipefail
          mkdir -p build/logs
          scripts/fuzz.sh 2>&1 | tee build/logs/fuzz.log

      - name: Save fuzzer results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-results
          path: |
            build/logs/
            build/fuzz/
          if-no-files-found: ignore
          retention-days: 1
  checks:
    name: Portable checks
    needs: changes
    if: inputs.mode != 'acceptance'
    # Same-ref repository code; no external checkout or action mutation precedes this call.
    uses: ./.github/workflows/portable-checks.yml # zizmor: ignore[self-repository]
    with:
      run_fixtures:
        ${{ contains(fromJSON(needs.changes.outputs.tasks), 'native') }}

  # The required check: green only when every part of the gate passed.
  gate:
    name:
      ${{ inputs.mode == 'acceptance' && 'Acceptance bookkeeping' || 'macOS' }}
    needs:
      [changes, checks, verify, mac-core, apple-builds, ios-core, sequoia, fuzz]
    if:
      always() && github.event.action != 'closed' && inputs.mode != 'acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every part
        env:
          PLAN: ${{ needs.changes.outputs.jobs }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/verify-changed.py --gate

      - name: Prepare coverage tools
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:astral-sh/uv pipx:coverage aqua:cli/cli
      - name: Receive every script coverage partition
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-python-*
          path: build/coverage/parts
      - name: Combine complete script coverage
        if: github.event_name != 'pull_request'
        run: |
          export COVERAGE_PY=coverage
          mkdir -p build/coverage/python
          cp build/coverage/parts/coverage-python-portable/.coverage build/coverage/python/.coverage.portable
          cp build/coverage/parts/coverage-python-macos/.coverage build/coverage/python/.coverage.macos
          python3 scripts/coverage-report.py python
          cat build/coverage/python/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete script coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: build/coverage/python/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
