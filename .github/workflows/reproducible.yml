name: Reproducible build

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 1 * *"

permissions:
  contents: read

jobs:
  compare:
    name: Build twice and compare
    runs-on:
      ${{ github.repository == 'Se7enbrc/glimmer' && github.ref ==
      'refs/heads/main' && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner && 'glimmer-native-m4'
      || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify M4 admission
        if: runner.environment == 'self-hosted'
        env:
          GLIMMER_M4_ADMISSION: ${{ secrets.GLIMMER_M4_ADMISSION }}
        run: /Library/GlimmerActions/accept-job.sh --require-proof

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare pinned runtime
        uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: python aqua:cli/cli
          cache: "false"

      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          sw_vers

      - name: Build twice from fresh clones and compare
        run: scripts/compare-builds.sh "$RUNNER_TEMP/reproducible"
