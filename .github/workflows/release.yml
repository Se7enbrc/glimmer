name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate or promote tested candidate bytes
        required: true
        default: candidate
        type: choice
        options: [candidate, promote]
      expected_sha:
        description: Reviewed dispatch branch commit (full 40-character SHA)
        required: true
        type: string
      rc_tag:
        description: Candidate tag, for example 2026.10.6-rc.1
        required: true
        type: string
      candidate_sha:
        description: Promotion only, exact source SHA attested by the candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: glimmer-release
  cancel-in-progress: false

jobs:
  verify-checks:
    name: Hooks and checks
    if: >-
      github.repository == 'Se7enbrc/glimmer' && inputs.operation == 'candidate'
      && github.ref == 'refs/heads/release-candidate'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      record: ${{ steps.verify.outputs.record }}
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require all checks green for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks

      - name: Prepare verification
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          for tool in swiftlint actionlint pre-commit; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          scripts/install-ci-scanner.sh
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-release.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Verify without signing credentials
        id: verify
        run: scripts/ci-release.sh verify-checks

  verify-tests:
    name: Unit tests
    if: >-
      github.repository == 'Se7enbrc/glimmer' && inputs.operation == 'candidate'
      && github.ref == 'refs/heads/release-candidate'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      record: ${{ steps.verify.outputs.record }}
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require all checks green for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks

      - name: Prepare verification
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-release.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Verify without signing credentials
        id: verify
        run: scripts/ci-release.sh verify-tests

  verify-asan:
    name: AddressSanitizer
    if: >-
      github.repository == 'Se7enbrc/glimmer' && inputs.operation == 'candidate'
      && github.ref == 'refs/heads/release-candidate'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      record: ${{ steps.verify.outputs.record }}
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require all checks green for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks

      - name: Prepare verification
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-release.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Verify without signing credentials
        id: verify
        run: scripts/ci-release.sh verify-asan

  release:
    needs: [verify-checks, verify-tests, verify-asan]
    if: >-
      !cancelled() && github.repository == 'Se7enbrc/glimmer' &&
      ((inputs.operation == 'candidate' && github.ref ==
      'refs/heads/release-candidate' && needs.verify-checks.result == 'success'
      && needs.verify-tests.result == 'success' && needs.verify-asan.result ==
      'success') || (inputs.operation == 'promote' && github.ref ==
      'refs/heads/main'))
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: read
      attestations: write
      id-token: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RC_TAG: ${{ inputs.rc_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      ACTIONS_STEP_DEBUG:
        ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
      ACTIONS_RUNNER_DEBUG:
        ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check release source
        run: scripts/ci-release.sh check

      - name: Require all checks green for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh checks

      - name: Prepare toolchain
        if: inputs.operation == 'candidate'
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/glimmer-release.xcconfig"
          cat > "$XCODE_XCCONFIG_FILE" <<'XCCONFIG'
          SWIFT_TREAT_WARNINGS_AS_ERRORS = YES
          GCC_TREAT_WARNINGS_AS_ERRORS = YES
          XCCONFIG
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$XCODE_XCCONFIG_FILE" >> "$GITHUB_ENV"

      - name: Require every verification record
        if: inputs.operation == 'candidate'
        env:
          VERIFY_CHECKS_RESULT: ${{ needs.verify-checks.result }}
          VERIFY_CHECKS_RECORD: ${{ needs.verify-checks.outputs.record }}
          VERIFY_TESTS_RESULT: ${{ needs.verify-tests.result }}
          VERIFY_TESTS_RECORD: ${{ needs.verify-tests.outputs.record }}
          VERIFY_ASAN_RESULT: ${{ needs.verify-asan.result }}
          VERIFY_ASAN_RECORD: ${{ needs.verify-asan.outputs.record }}
        run: scripts/ci-release.sh verified

      - name: Build Release without signing credentials
        if: inputs.operation == 'candidate'
        run: scripts/ci-release.sh build

      - name: Sign and notarize
        if: inputs.operation == 'candidate'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APP_PROVISIONPROFILE_BASE64:
            ${{ secrets.APP_PROVISIONPROFILE_BASE64 }}
          HELPER_PROVISIONPROFILE_BASE64:
            ${{ secrets.HELPER_PROVISIONPROFILE_BASE64 }}
        run: scripts/ci-release.sh sign

      - name: Package without signing credentials
        if: inputs.operation == 'candidate'
        id: package
        run: scripts/ci-release.sh package

      - name: Attest final release assets
        if: inputs.operation == 'candidate'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.dmg-path }}
            ${{ steps.package.outputs.zip-path }}
          push-to-registry: false
          create-storage-record: false

      - name: Publish candidate and update RC channel
        if: inputs.operation == 'candidate'
        env:
          RELEASE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          RELEASE_PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_CONTENTS_TOKEN: ${{ secrets.RELEASE_CONTENTS_TOKEN }}
        run: scripts/ci-release.sh publish

      - name: Verify candidate provenance and unchanged source
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-release.sh prepare-promotion

      - name: Promote tested bytes to stable
        if: inputs.operation == 'promote'
        env:
          # Validation reads with the run token; publishing switches to the contents token.
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTENTS_TOKEN: ${{ secrets.RELEASE_CONTENTS_TOKEN }}
        run: scripts/ci-release.sh promote

      - name: Update Homebrew
        if: inputs.operation == 'promote'
        env:
          RELEASE_CONTENTS_TOKEN: ${{ secrets.RELEASE_CONTENTS_TOKEN }}
        run: scripts/ci-release.sh tap

      - name: Remove temporary credentials
        if: always()
        run: scripts/ci-release.sh cleanup
