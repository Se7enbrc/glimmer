name: Unsigned build cache
description:
  Cache compiler state without signing credentials or release artifacts
inputs:
  variant:
    description: Distinguish SDK, instrumentation and configuration consumers
    required: true
outputs:
  key:
    value: ${{ steps.key.outputs.key }}
    description: Exact snapshot key
  paths:
    value: ${{ steps.key.outputs.paths }}
    description: Compiler and package paths
  hit:
    value: ${{ steps.restore.outputs.cache-hit }}
    description: Whether the exact snapshot exists
runs:
  using: composite
  steps:
    - name: Key compiler state
      id: key
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        LOCKS:
          ${{ hashFiles('**/Package.resolved', 'Package.swift',
          'third_party/**', '**/*.xcconfig', '**/project.pbxproj') }}
      run: |
        test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
        xcode=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$DEVELOPER_DIR/../version.plist")
        prefix="compiler-v2-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${xcode}-${VARIANT}-${LOCKS}"
        printf 'prefix=%s\nkey=%s\n' "$prefix" "$prefix" >> "$GITHUB_OUTPUT"
        {
          echo 'paths<<CACHE_PATHS'
          echo 'build/SourcePackages'
          echo 'build/CompilationCache.noindex'
          echo 'iOS/build/production/DerivedData/SourcePackages'
          echo 'iOS/build/production/DerivedData/CompilationCache.noindex'
          echo 'iOS/build/ci/DerivedData/SourcePackages'
          echo 'iOS/build/ci/DerivedData/CompilationCache.noindex'
          echo '.build'
          echo 'CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
    - name: Restore unsigned compiler state
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Enable compilation caching
      shell: bash
      run: |
        config="${XCODE_XCCONFIG_FILE:-$RUNNER_TEMP/glimmer-cache.xcconfig}"
        printf '\nCOMPILATION_CACHE_ENABLE_CACHING = YES\nCOMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS = YES\n' >> "$config"
