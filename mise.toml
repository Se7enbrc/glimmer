min_version = "2026.10.19"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
"aqua:jdx/hk" = "2.8.1"
"aqua:apple/pkl" = "0.32.2"
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos"] }
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:trufflesecurity/trufflehog" = "3.97.8"
"aqua:astral-sh/uv" = "0.13.5"
"aqua:cli/cli" = "2.101.0"
node = "26.9.0"
python = "3.14.8"
"npm:prettier" = "4.0.0-alpha.8"
"npm:markdownlint-cli" = "0.41.0"
"pipx:yamllint" = "1.35.1"
"pipx:pre-commit-hooks" = "4.6.0"
"pipx:coverage" = "7.16.2"

[env]
HK_MISE = "1"
