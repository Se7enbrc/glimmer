min_version = "2026.10.19"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
"aqua:jdx/hk" = "2.10.0"
"aqua:apple/pkl" = "0.32.2"
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos"] }
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:trufflesecurity/trufflehog" = "3.99.7"
"aqua:astral-sh/uv" = "0.13.6"
"aqua:cli/cli" = "2.103.3"
node = "26.13.0"
python = "3.15.2"
"npm:prettier" = "4.0.0-alpha.13"
"npm:markdownlint-cli" = "0.50.0"
"pipx:yamllint" = "1.38.0"
"pipx:coverage" = "7.17.0"

[env]
HK_MISE = "1"
