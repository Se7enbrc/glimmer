# See https://pre-commit.com for usage.
# Install hooks once:  pre-commit install
# Run on all files:    pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^third_party/
      - id: end-of-file-fixer
        exclude: ^third_party/
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: fix-byte-order-marker

  # YAML linting.
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6 # v1.35.1
    hooks:
      - id: yamllint
        args:
          [
            --format,
            parsable,
            "-d",
            "{extends: default, rules: {line-length: disable, document-start:
            disable}}",
          ]
        exclude: ^third_party/

  # Markdown linting.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: f295829140d25717bc79368d3f966fc1f67a824f # v0.41.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013", "MD029", "MD036", "MD041"]
        exclude: ^third_party/

  # Prettier - yaml/markdown/json formatting.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        args: ["--prose-wrap=always"]
        exclude: ^third_party/

  # Local scans check staged changes; CI also checks tracked files and its commit range.
  # Both scanners withhold findings from public logs.
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Scan for verified credentials without printing findings.
        entry: bash scripts/check-secrets.sh verified
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: private-keys
        name: Private keys (offline)
        description: Reject private keys without external verification.
        entry: bash scripts/check-private-keys.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Swift files retain the same strict rules locally and in CI.
  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        description: SwiftLint --fix then strict lint (zero warnings).
        # A formatter rewrite must be reviewed and staged explicitly.
        entry:
          bash -c 'set -e; ROOT=$(git rev-parse --show-toplevel);
          LINT="$ROOT/scripts/lint-swift.sh"; BEFORE=$(git -C "$ROOT" diff --
          "*.swift" "*.swiftinterface" | shasum -a 256); "$LINT" --fix --quiet;
          AFTER=$(git -C "$ROOT" diff -- "*.swift" "*.swiftinterface" | shasum
          -a 256); if [ "$BEFORE" != "$AFTER" ]; then echo "swiftlint --fix
          rewrote files. Review the diff and re-add them:" >&2; git -C "$ROOT"
          diff --stat -- "*.swift" >&2 || true; exit 1; fi; "$LINT" lint
          --strict --quiet'
        language: system
        types: [swift]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: actionlint
        name: Actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: zizmor
        name: Zizmor
        entry: zizmor --offline
        language: system
        files: ^\.github/(workflows/.*\.ya?ml$|actions/.*/action\.ya?ml$)
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: ^third_party/
