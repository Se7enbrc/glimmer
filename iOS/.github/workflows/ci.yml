name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare verification
        run: |
          xcodebuild -version
          xcrun swift --version
          brew install swiftlint actionlint pre-commit
          scripts/install-ci-scanner.sh

      - name: Pre-commit
        env:
          GLIMMER_SECRET_SCAN_ALL_FILES: "1"
          SCAN_FROM:
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCAN_FROM" ] && [ "$SCAN_FROM" != 0000000000000000000000000000000000000000 ]; then
            export PRE_COMMIT_FROM_REF="$SCAN_FROM"
            export PRE_COMMIT_TO_REF="$GITHUB_SHA"
          fi
          pre-commit run --all-files

      - name: Check source
        run: make check

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build/logs
          make app 2>&1 | tee build/logs/build.log
          ! grep -E '(^|[[:space:]])warning:' build/logs/build.log

      - name: Test on iPhone Simulator
        run: |
          set -o pipefail
          make test TEST_FLAGS='-enableCodeCoverage YES -resultBundlePath build/CI-tests.xcresult' \
            2>&1 | tee build/logs/test.log
          ! grep -E '(^|[[:space:]])warning:' build/logs/test.log

      - name: Record coverage baseline
        run: |
          xcrun xccov view --report --json build/CI-tests.xcresult > build/logs/coverage.json
          xcrun xccov view --report build/CI-tests.xcresult > build/logs/coverage.txt
          {
            printf '### iOS Simulator coverage\n\n```text\n'
            cat build/logs/coverage.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-logs
          path: |
            build/logs/
            build/DerivedData/Logs/Test/*.xcresult
            build/CI-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  device:
    name: iOS Release device
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production app without signing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          make app CONFIG=Release DESTINATION='generic/platform=iOS' \
            BUILD_FLAGS='SWIFT_ACTIVE_COMPILATION_CONDITIONS=' 2>&1 | tee build/logs/device.log
          ! grep -E '(^|[[:space:]])warning:' build/logs/device.log

      - name: Save device build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-build-log
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: iOS
    if: always()
    needs: [verify, device]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Simulator and device verification
        env:
          SIMULATOR_RESULT: ${{ needs.verify.result }}
          DEVICE_RESULT: ${{ needs.device.result }}
        run:
          test "$SIMULATOR_RESULT" = success && test "$DEVICE_RESULT" = success
